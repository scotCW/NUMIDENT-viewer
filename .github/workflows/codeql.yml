name: CodeQL

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    branches: [master]
    paths-ignore: ["**/*.md", ".github/ISSUE_TEMPLATE/**"]
  schedule:
    - cron: "23 6 * * 1"

# A newer push replaces a scan that is still running on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: go
            os: ubuntu-latest
            build-mode: autobuild
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-latest
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the Swift package
        if: matrix.language == 'swift'
        working-directory: swift
        run: swift build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
